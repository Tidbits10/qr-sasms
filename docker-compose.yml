services:
  db:
    image: postgres:16-alpine
    container_name: qrsasms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrsasms
      POSTGRES_PASSWORD: qrsasms
      POSTGRES_DB: qrsasms
    ports:
      - "5432:5432"
    volumes:
      - qrsasms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrsasms -d qrsasms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qrsasms_pgdata:
